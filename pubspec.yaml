name: mutate4dart
description: >-
  Mutation testing for Dart and Flutter projects. Mutates covered code with
  package:analyzer, runs only the tests that import it, and reports a
  mutation score per method next to its CRAP score (sibling of crap4dart).
version: 0.4.1
publish_to: none
repository: https://github.com/ferrarafer/mutate4dart

environment:
  sdk: ^3.5.0

executables:
  mutate4dart: mutate4dart

dependencies:
  analyzer: ^7.3.0
  args: ^2.5.0
  crap4dart:
    git:
      url: https://github.com/ferrarafer/crap4dart.git
      ref: v0.12.2
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
